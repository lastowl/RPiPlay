<!DOCTYPE html>
<html>
<head>
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
}
video {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
}
</style>
</head>
<body>
<script>
/*
 * Plays the RTP/MPEG-TS stream RPiPlay sends to udpPort through the TV's
 * built-in Miracast media pipeline (same mechanism as com.webos.app.miracast),
 * so umediaserver and the compositor handle the video plane for us.
 *
 * Launch params (all optional):
 *   {"udpPort":5000, "width":1920, "height":1080, "framerate":30, "lowLatency":true,
 *    "audioCodec":"AAC", "audioRate":48000, "audioChannels":2}
 * audioCodec "none" leaves audio out of the mediaOption.
 */
/* RPiPlay listens here for player events (see video_renderer_webos.c) */
var EVENT_PORT = 7737;
var eventSeq = 0;

/* Fire-and-forget: an image request needs no CORS permission */
function report(msg) {
    new Image().src = "http://127.0.0.1:" + EVENT_PORT + "/" +
        encodeURIComponent(msg) + "?" + (eventSeq++);
}

var DEFAULTS = { udpPort: 5000, width: 1920, height: 1080, framerate: 30, lowLatency: true,
                 audioCodec: "AAC", audioRate: 48000, audioChannels: 2, testFile: "" };

function readParams() {
    var p = {};
    try {
        if (window.PalmSystem && PalmSystem.launchParams)
            p = JSON.parse(PalmSystem.launchParams) || {};
    } catch (e) {
        console.log("[airplay] bad launchParams: " + e);
    }
    var out = {};
    for (var k in DEFAULTS)
        out[k] = (p[k] !== undefined) ? p[k] : DEFAULTS[k];
    return out;
}

function startPlayer() {
    var p = readParams();
    var old = document.getElementById("player");
    if (old) {
        old.pause();
        old.parentNode.removeChild(old);
    }

    var option = {
        mediaTransportType: "MIRACAST",
        option: {
            transmission: {
                miracastInfo: {
                    udpPort: p.udpPort,
                    video: {
                        codec: "H264",
                        width: p.width,
                        height: p.height,
                        framerate: p.framerate,
                        displayQueueSize: p.lowLatency ? 1 : 9
                    }
                }
            }
        }
    };
    if (p.audioCodec !== "none") {
        option.option.transmission.miracastInfo.audio = {
            codec: p.audioCodec,
            frequency: p.audioRate,
            channels: p.audioChannels,
            bitWidth: 16
        };
    }

    var video = document.createElement("video");
    video.id = "player";
    video.loop = !!p.testFile;
    var source = document.createElement("source");
    if (p.testFile) {
        /* Debug: plain file playback, e.g. {"testFile":"file:///path/clip.mp4"} */
        source.src = p.testFile;
        source.type = "video/mp4";
    } else {
        source.src = "miracast://miracast";
        source.type = "video/mp4; mediaOption=" + escape(JSON.stringify(option));
    }
    video.appendChild(source);
    /* Like com.webos.app.miracast: play only once the pipeline has loaded */
    video.addEventListener("loadeddata", function () {
        report("loadeddata");
        video.play();
    });
    /* umediaserver status: videoInfo, playbackNotificationInfo, errors */
    video.addEventListener("umsmediainfo", function (e) {
        report("umsmediainfo " + e.detail);
    });
    ["loadstart", "loadedmetadata", "canplay", "playing", "pause", "waiting",
     "stalled", "suspend", "emptied", "ended"].forEach(function (name) {
        video.addEventListener(name, function () { report(name); });
    });
    video.addEventListener("error", function () {
        report("error " + (video.error && video.error.code));
    });
    document.body.appendChild(video);
    video.load();
    report("player created " + p.width + "x" + p.height);
}

document.addEventListener("webOSRelaunch", startPlayer, true);
startPlayer();
</script>
</body>
</html>
